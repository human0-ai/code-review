name: human0 AI Code Review
description: An autonomous AI reviewer that approves or requests changes on every pull request.
author: human0

branding:
  icon: git-pull-request
  color: purple

inputs:
  claude_code_oauth_token:
    description: Claude.ai OAuth token. Provide this or anthropic_api_key.
    required: false
  anthropic_api_key:
    description: Anthropic API key. Provide this or claude_code_oauth_token.
    required: false
  github_token:
    description: GitHub token used to read the PR and post the review.
    required: true
  pr_number:
    description: Pull request number.
    required: true
  head_sha:
    description: Head commit SHA of the PR.
    required: true
  repo:
    description: Repository in owner/name form.
    required: true
  prompt_file:
    description: >-
      Path in the checked-out repo to your review prompt (e.g. docs/ai-review.md).
      Required — the action ships no default prompt; each repo owns its own.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Cache Claude Code CLI
      uses: actions/cache@v4
      with:
        path: ~/.npm-global
        key: claude-code-cli-v4-${{ runner.os }}

    - name: Install Claude Code
      shell: bash
      run: |
        npm config set prefix ~/.npm-global
        export PATH="$HOME/.npm-global/bin:$PATH"

        # `claude` is a small wrapper; the interpreter is a ~500MB per-platform
        # binary in a separate package, declared as an optional dependency of
        # the wrapper. Two independent things go wrong on a GitHub runner:
        #
        #  1. npm does not pull that optional dependency in. The install log
        #     reads "added 1 package", and --include=optional does not change
        #     it. So the binary has to be asked for by name.
        #  2. npm 11 (the default on Node 24 runners) refuses lifecycle scripts
        #     it has not been told to allow, so the wrapper's postinstall —
        #     which links the binary over the bin/claude stub — never runs.
        #
        # Allowing the script fixes (2) but not (1): with nothing to link, the
        # postinstall prints "Native package not found" and `claude` still dies
        # with "claude native binary not installed".
        npm install -g '@anthropic-ai/claude-code@2'

        # Ask npm where it actually put that, rather than assuming the POSIX
        # global layout — the Windows global root has no lib/ segment.
        GLOBAL_ROOT="$(npm root -g)"
        WRAPPER="$GLOBAL_ROOT/@anthropic-ai/claude-code"

        # Take the version from the wrapper npm just installed, so the native
        # package is guaranteed to match it — resolving the @2 range a second
        # time could straddle a publish.
        VERSION="$(node -p "require('$WRAPPER/package.json').version")"

        # Same platform key the wrapper's postinstall computes, so the two agree
        # on arch and on musl vs glibc.
        PLATFORM=$(node -pe '
          const a=require("os").arch();
          const musl=process.platform==="linux"
            && process.report?.getReport?.().header?.glibcVersionRuntime===undefined;
          process.platform==="linux" ? "linux-"+a+(musl?"-musl":"") : process.platform+"-"+a')

        npm install -g "@anthropic-ai/claude-code-$PLATFORM@$VERSION"

        # Now there is something to link — run the postinstall npm skipped.
        node "$WRAPPER/install.cjs"

        # Fail in this step, not three minutes later inside the review.
        claude --version

    - name: Run review
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        export PATH="$HOME/.npm-global/bin:$PATH"
        node ${{ github.action_path }}/run.mjs
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        REPO: ${{ inputs.repo }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
